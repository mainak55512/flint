name: Build and Release Flint

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            compiler: gcc
            bin_name: flint
            archive_name: flint-linux-x86_64.tar.gz

          - os: macos-latest
            target: macos-arm64
            compiler: clang
            bin_name: flint
            archive_name: flint-macos-arm64.tar.gz

          - os: windows-latest
            target: windows-x86_64
            compiler: x86_64-w64-mingw32-gcc
            bin_name: flint.exe
            archive_name: flint-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine Version
        id: vars
        shell: bash
        run: |
          VERSION=$(jq -r '.version' composition.json)
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build on Linux & macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ${{ matrix.compiler }} \
            "-std=gnu11" \
            -O3 \
            -DNDEBUG \
            -fno-stack-protector \
            -Wno-unused-result \
            -DMG_TLS=MG_TLS_BUILTIN \
            -DMG_ENABLE_LOG=0 \
            -DPROJECT_VERSION=\"${{ steps.vars.outputs.version }}\" \
            -I./include \
            -I./deps/arena/include \
            -I./deps/CString/include \
            -I./deps/container/include \
            -I./deps/Cmap/include \
            -I./deps/yyjson/src \
            -I./deps/mongoose \
            ./deps/arena/lib/arena.c \
            ./deps/CString/lib/cstring.c \
            ./deps/container/lib/cvector.c \
            ./deps/Cmap/lib/cmap.c \
            ./deps/yyjson/src/yyjson.c \
            ./deps/mongoose/mongoose.c \
            ./src/main.c \
            ./src/cli.c \
            ./src/fetch.c \
            ./src/config_handler.c \
            ./src/file_handler.c \
            ./src/package_manager.c \
            ./src/utils.c \
            ./src/project_handler.c \
            -o "${{ matrix.bin_name }}"

          chmod +x "${{ matrix.bin_name }}"
          tar -czvf "${{ matrix.archive_name }}" "${{ matrix.bin_name }}"

      - name: Build on Windows (MinGW)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. Compile version.rc into a COFF object file (version.res)
          windres.exe version.rc -O coff -o version.res
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 2. Compile and link Flint with version.res
          # Note: Using -O2 and omitting -fno-stack-protector / -static to prevent Defender ML false positives
          $argsList = @(
            "-std=gnu11",
            "-O2",
            "-DNDEBUG",
            "-Wno-unused-result",
            "-D_CRT_SECURE_NO_WARNINGS",
            "-DMG_TLS=MG_TLS_BUILTIN",
            "-DMG_ENABLE_LOG=0",
            "-DPROJECT_VERSION=`"${{ steps.vars.outputs.version }}`"",
            "-I./include",
            "-I./deps/arena/include",
            "-I./deps/CString/include",
            "-I./deps/container/include",
            "-I./deps/Cmap/include",
            "-I./deps/yyjson/src",
            "-I./deps/mongoose",
            "./deps/arena/lib/arena.c",
            "./deps/CString/lib/cstring.c",
            "./deps/container/lib/cvector.c",
            "./deps/Cmap/lib/cmap.c",
            "./deps/yyjson/src/yyjson.c",
            "./deps/mongoose/mongoose.c",
            "./src/main.c",
            "./src/cli.c",
            "./src/fetch.c",
            "./src/config_handler.c",
            "./src/file_handler.c",
            "./src/package_manager.c",
            "./src/utils.c",
            "./src/project_handler.c",
            "version.res",
            "-lws2_32",
            "-ladvapi32",
            "-lcrypt32",
            "-o",
            "${{ matrix.bin_name }}"
          )
          & ${{ matrix.compiler }} $argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Windows Binary (If Certificate Secrets Exist)
        if: runner.os == 'Windows' && env.PFX_BASE64 != ''
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ matrix.bin_name }}"
          Remove-Item cert.pfx

      - name: Verify with Windows Defender & Package Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Scanning ${{ matrix.bin_name }} with Windows Defender..."
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "${{ github.workspace }}\${{ matrix.bin_name }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Windows Defender flagged the binary! Check the log output above."
          } else {
            Write-Host "Windows Defender scan passed with 0 threats detected."
          }

          Compress-Archive -Path "${{ matrix.bin_name }}" -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.bin_name }}
            ${{ matrix.archive_name }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*/*.tar.gz
            artifacts/*/*.zip
